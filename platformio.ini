[platformio]
src_dir = stm32_hal/Core/Src
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = dfu
monitor_speed = 115200
lib_ignore =
    STM32_USB_Device_Library-CDC
    STM32_USB_Device_Library-Core
    STM32_USB_Device_Library-CompositeBuilder

build_flags =
    -Istm32_hal/Core/Inc

[env:blackpill_f411ce_stlink]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
lib_ignore =
    STM32_USB_Device_Library-CDC
    STM32_USB_Device_Library-Core
    STM32_USB_Device_Library-CompositeBuilder

build_flags =
    -Istm32_hal/Core/Inc